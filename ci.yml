name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linter + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Linter (ruff)
        run: ruff check src/ tests/

      - name: Tests (pytest)
        run: pytest tests/ -v

  secretos:
    name: Comprobar que no hay claves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar claves y .env en el repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Hay un fichero .env versionado"; exit 1
          fi
          # Patrones típicos de claves (Anthropic, OpenAI, Google). Se excluye .github para no auto-detectarse.
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}' -- . ':!.github'; then
            echo "::error::Posible clave de API en el código"; exit 1
          fi
          echo "Sin claves a la vista"
